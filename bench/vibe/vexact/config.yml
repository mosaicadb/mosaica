float:
  cosine: &vexact
  - base_args: ['@metric']
    constructor: VexactExact
    disabled: false
    ood: true
    singularity_image: vexact
    module: vibe.algorithms.vexact
    name: vexact-exact
    run_groups:
      exact:
        args:
          basis: [dual]
        query_args:
          mode: [exact]
  - base_args: ['@metric']
    constructor: VexactApprox
    disabled: false
    ood: true
    singularity_image: vexact
    module: vibe.algorithms.vexact
    name: vexact-approx
    run_groups:
      approx:
        args:
          basis: [dual]
        query_args:
          psi: [2, 3, 3.5, 4, 4.5, 5, 6, 7]
  # the legacy approximate arm (the spread order by nprobe), kept for comparison
  - base_args: ['@metric']
    constructor: VexactNprobe
    disabled: false
    ood: true
    singularity_image: vexact
    module: vibe.algorithms.vexact
    name: vexact-nprobe
    run_groups:
      nprobe:
        args:
          basis: [dual]
        query_args:
          nprobe: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512]
  # research/levels-clusters' candidates (REPORT_BUILD.md), in the legacy arm: A clusters by N, B two deterministic
  # levels, C both
  - base_args: ['@metric']
    constructor: VexactNprobe
    disabled: false
    ood: true
    singularity_image: vexact
    module: vibe.algorithms.vexact
    name: vexact-approx-lc
    run_groups:
      A:
        args:
          basis: [dual]
          order: [corpus]
          clusters: [by-n]
          dlv: [fit]
        query_args: &lc_query
          nprobe: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512]
      B:
        args:
          basis: [dual]
          order: [corpus]
          clusters: ["1000"]
          dlv: ["16.32"]
        query_args: *lc_query
      C:
        args:
          basis: [dual]
          order: [corpus]
          clusters: [by-n]
          dlv: ["16.32"]
        query_args: *lc_query
  normalized: *vexact
