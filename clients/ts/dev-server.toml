[bundle]
path = "data/bench-fixtures/1e9"
cache = "mosaica-demo/dev-server/cache"
# Inside the bundle's directory, so a rebuild, which replaces the directory, replaces the log with
# it: a server refuses a log written for another bundle.
wal = "data/bench-fixtures/1e9/wal.log"

[disclosure]
token_max_lifetime = 3600

[serve]
viewer = "127.0.0.1:37585"
session = "127.0.0.1:49303"
control = "127.0.0.1:45721"
max_k = 5000
operator_credential_env = "MOSAICA_OPERATOR_CRED"
dev_cors_origins = ["http://localhost:5173"]

[catalogue]
dir = "mosaica-demo/dev-server/catalogue"
