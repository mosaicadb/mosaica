<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mosaica demo</title>
    <meta name="description" content="An interactive map served by Mosaica, where every count, cluster and point is computed over what the chosen viewer may see." />
    <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><title>Mosaica</title><style>rect%7Bfill:%231b1d21%7D%40media (prefers-color-scheme: dark)%7Brect%7Bfill:%23eceef1%7D%7D</style><rect x="3.25" y="3.12" width="5.75" height="5.75" rx="1.03"/><rect x="14.75" y="2.62" width="6.75" height="6.75" rx="1.21"/><rect x="27.62" y="3.5" width="5" height="5" rx="0.9"/><rect x="2.5" y="14.38" width="7.25" height="7.25" rx="1.3"/><rect x="13.62" y="13.5" width="9" height="9" rx="1.62"/><rect x="26.88" y="14.75" width="6.5" height="6.5" rx="1.17"/><rect x="3.25" y="27.12" width="5.75" height="5.75" rx="1.03"/><rect x="14.62" y="26.5" width="7" height="7" rx="1.26"/><rect x="38.75" y="26.62" width="6.75" height="6.75" rx="1.21"/><rect x="26.75" y="38.62" width="6.75" height="6.75" rx="1.21"/><rect x="38.12" y="38" width="8" height="8" rx="1.44"/></svg>' type="image/svg+xml" />
    <script>
      // Set before the first paint: the stored choice, else the system's.
      (() => {
        let stored = null;
        try { stored = localStorage.getItem('mosaica-demo-theme'); } catch {}
        const system = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = stored === 'light' || stored === 'dark' ? stored : system;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light dark;
        --ink: light-dark(#1b1d21, #eceef1);
        --muted: light-dark(#5d626b, #a3a8b0);
        --line: light-dark(#e3e5e8, #2a2d33);
        --surface: light-dark(#ffffff, #111317);
        --raised: light-dark(#f5f6f7, #1b1d21);
      }
      :root[data-theme='light'] { color-scheme: light; }
      :root[data-theme='dark'] { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        display: grid;
        grid-template-rows: auto 1fr;
        background: var(--surface);
        color: var(--ink);
        font: 14px/1.4 'Instrument Sans', system-ui, sans-serif;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 20px;
        padding: 8px 16px;
        border-bottom: 1px solid var(--line);
      }
      .brand { display: flex; align-items: center; gap: 8px; color: inherit; text-decoration: none; font-weight: 600; font-size: 16px; }
      .brand svg { width: 22px; height: 22px; fill: currentColor; }
      .dataset { display: flex; flex-direction: column; min-width: 0; flex: 1 1 260px; }
      .dataset strong { font-weight: 500; }
      .dataset small, .viewer small { color: var(--muted); font-size: 12px; }
      .dataset a, .viewer a { color: inherit; }
      .viewer { display: flex; flex-direction: column; gap: 2px; max-width: 340px; }
      .viewer label { display: flex; align-items: center; gap: 8px; font-weight: 500; }
      select {
        font: inherit;
        color: inherit;
        background: var(--raised);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 4px 8px;
      }
      nav { display: flex; align-items: center; gap: 14px; }
      #theme {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        padding: 0;
        color: inherit;
        background: var(--raised);
        border: 1px solid var(--line);
        border-radius: 6px;
        cursor: pointer;
      }
      #theme svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
      :root[data-theme='dark'] #theme .moon, :root[data-theme='light'] #theme .sun { display: none; }
      nav a { color: inherit; font-weight: 500; text-decoration: none; }
      nav a:hover, nav a:focus-visible { text-decoration: underline; }
      main { min-height: 0; position: relative; }
      mosaica-explorer { --mosaica-explorer-height: 100%; height: 100%; display: block; }
      .notice { padding: 24px 16px; color: var(--muted); }
      @media (max-width: 720px) {
        header { padding: 8px 12px; }
        .dataset small, .viewer small { display: none; }
        .viewer { max-width: none; }
      }
    </style>
    <script type="module" src="./mosaica-components.js"></script>
  </head>
  <body>
    <header>
      <a class="brand" href="https://github.com/mosaicadb/mosaica">
        <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="3.25" y="3.12" width="5.75" height="5.75" rx="1.03"/><rect x="14.75" y="2.62" width="6.75" height="6.75" rx="1.21"/><rect x="27.62" y="3.5" width="5" height="5" rx="0.9"/><rect x="2.5" y="14.38" width="7.25" height="7.25" rx="1.3"/><rect x="13.62" y="13.5" width="9" height="9" rx="1.62"/><rect x="26.88" y="14.75" width="6.5" height="6.5" rx="1.17"/><rect x="3.25" y="27.12" width="5.75" height="5.75" rx="1.03"/><rect x="14.62" y="26.5" width="7" height="7" rx="1.26"/><rect x="38.75" y="26.62" width="6.75" height="6.75" rx="1.21"/><rect x="26.75" y="38.62" width="6.75" height="6.75" rx="1.21"/><rect x="38.12" y="38" width="8" height="8" rx="1.44"/></svg>
        Mosaica
      </a>
      <div class="dataset">
        <strong id="dataset-name"></strong>
        <small id="dataset-sources"></small>
      </div>
      <div class="viewer">
        <label>Dataset <select id="dataset"></select></label>
      </div>
      <div class="viewer">
        <label>Viewing as <select id="persona" aria-describedby="persona-about"></select></label>
        <small id="persona-about"></small>
      </div>
      <nav>
        <a id="docs" href="https://docs.mosaicadb.com/">Docs</a>
        <a id="repo" href="https://github.com/mosaicadb/mosaica">GitHub</a>
        <button id="theme" type="button">
          <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </nav>
    </header>
    <main id="mount"><p class="notice">Loading the map…</p></main>
    <script type="module">
      // Tokens come from this page's own server, which holds the only credentials and mints a
      // read-only session for the chosen persona. Each dataset's map requests go to its own
      // viewer, at the address the dataset names or under the path it names on this origin.
      const site = await (await fetch('/site.json')).json();
      const $ = (id) => document.getElementById(id);
      const params = new URLSearchParams(location.search);

      document.title = site.title;
      $('docs').href = site.links.docs;
      $('repo').href = site.links.repo;

      const datasetSelect = $('dataset');
      const select = $('persona');
      for (const d of site.datasets) datasetSelect.add(new Option(d.name, d.id));
      datasetSelect.value = site.datasets.some((d) => d.id === params.get('dataset')) ? params.get('dataset') : site.default_dataset;
      const dataset = () => site.datasets.find((d) => d.id === datasetSelect.value);

      /** Fill the header for the chosen dataset and list its personas, keeping `wanted` if it has one. */
      function describe(wanted) {
        const d = dataset();
        $('dataset-name').textContent = `${d.name} · ${d.items}`;
        const sources = $('dataset-sources');
        sources.replaceChildren(`${d.summary} Data: `);
        d.sources.forEach((s, i) => {
          if (i > 0) sources.append('; ');
          if (s.url) {
            const a = document.createElement('a');
            a.href = s.url;
            a.textContent = s.label;
            sources.append(a);
          } else {
            sources.append(s.label);
          }
          sources.append(` (${s.note})`);
        });
        sources.append('.');
        select.replaceChildren(...d.personas.map((p) => new Option(p.label, p.id)));
        select.value = d.personas.some((p) => p.id === wanted) ? wanted : d.default_persona;
      }

      /** A token supplier for one persona, which the explorer calls again whenever its session ends. */
      const supplier = (datasetId, persona) => async () => {
        const query = `dataset=${encodeURIComponent(datasetId)}&persona=${encodeURIComponent(persona)}`;
        // Sent as JSON, which a page on another site cannot send here without the browser asking first.
        const response = await fetch(`/token?${query}`, {
          method: 'POST', headers: {'content-type': 'application/json'}, body: '{}',
        });
        if (!response.ok) throw new Error((await response.json()).error ?? `token: ${response.status}`);
        const {token, expiresAt} = await response.json();
        return {token, expiresAt: expiresAt ?? Infinity};
      };

      async function show() {
        const d = dataset();
        const persona = select.value;
        $('persona-about').textContent = d.personas.find((p) => p.id === persona)?.description ?? '';
        const url = new URL(location.href);
        url.searchParams.set('dataset', d.id);
        url.searchParams.set('as', persona);
        history.replaceState(null, '', url);
        // Another persona or dataset is another session. The old explorer is disposed, so
        // nothing it drew stays under the new one.
        const mount = $('mount');
        for (const old of mount.querySelectorAll('mosaica-explorer')) old.dispose();
        await customElements.whenDefined('mosaica-explorer');
        const explorer = document.createElement('mosaica-explorer');
        // A dataset names its viewer by address, or by path on this origin: '' for /v1/*,
        // '/arxiv' for /arxiv/v1/*.
        const absolute = /^https?:\/\//.test(d.viewer_url);
        explorer.setAttribute('viewer-url', absolute ? d.viewer_url : `${location.origin}${d.viewer_url}`);
        explorer.setAttribute('artifacts-per-tile', '50');
        // The filter panel floats over the map rather than docking beside it.
        explorer.setAttribute('layout', 'overlay');
        // The dataset's own defaults: the fields the filter panel always shows, what colours the
        // points, and the field that titles an item.
        for (const [name, value] of Object.entries(d.explorer ?? {})) explorer.setAttribute(name, value);
        explorer.authorise = supplier(d.id, persona);
        mount.replaceChildren(explorer);
      }

      describe(params.get('as'));

      const themeButton = $('theme');
      const labelTheme = () => {
        const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
        themeButton.setAttribute('aria-label', `Switch to ${next} mode`);
        themeButton.title = `Switch to ${next} mode`;
      };
      labelTheme();
      themeButton.addEventListener('click', () => {
        const theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
        document.documentElement.dataset.theme = theme;
        try { localStorage.setItem('mosaica-demo-theme', theme); } catch {}
        labelTheme();
        // The panels follow color-scheme at once. The map redraws its basemap when its `ground`
        // changes, and not when the page's scheme does, so its ground is set to the new theme.
        const maps = $('mount').querySelector('mosaica-explorer')?.shadowRoot?.querySelectorAll('mosaica-map') ?? [];
        if (maps.length === 0) return void show();
        for (const map of maps) map.ground = theme;
      });

      datasetSelect.addEventListener('change', () => {
        describe(null);
        show();
      });
      select.addEventListener('change', () => show());
      await show();
    </script>
  </body>
</html>
