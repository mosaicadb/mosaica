# The checks every pull request and every push to main must pass. Every fixture they use is
# synthesised from a seed, so they need no corpus.
#
# On a pull request, `changes` reads which paths the pull request changes, and the Rust jobs,
# `clippy`, `conformance` and `clients` run only where one of their inputs did. A job skipped by its `if:`
# reports as skipped, which `required` counts as passing. A workflow-level `paths:` filter would
# leave a required check waiting instead, because a workflow that does not run reports nothing.
# A push to main runs every job. `checks` and `docs` run on every change, because the advisories
# `cargo deny` reads change without a commit and the docs' link check names paths anywhere in the
# tree, and each takes about a minute.
#
# Not run here or by any other workflow: `#[ignore]`d tests, each of which builds a real corpus,
# runs for minutes to hours, or measures rather than asserts; the oracle's tests that need the
# Phase 0 corpus; and the viewport differential against real term skew, which a synthetic corpus
# cannot stand in for. A property held only by one of those is not gated.

name: gate

on:
  pull_request:
  push:
    branches: [main]

# A force-push or a second push to the same PR makes the earlier run's answer worthless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # A pull request's checkout is its merge commit, whose first parent is the tip of the base branch,
  # so the diff between them is what the pull request changes. Each output is true when a changed
  # path matches the inputs of the jobs that read it, and every output is true on a push or where
  # the diff fails.
  #
  # `build` is what the `mosaica` binary and the extension module are compiled from. `rust` adds the
  # files outside `crates/` that Rust tests read, as `scripts/test-affected.sh` lists them, and
  # nextest's configuration.
  # `conformance` adds the suite and the oracle; `clients` adds the clients, the corpora and examples
  # their tests serve, the contract and reference pages they check, and the release version's copies.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.areas.outputs.rust }}
      conformance: ${{ steps.areas.outputs.conformance }}
      clients: ${{ steps.areas.outputs.clients }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - id: areas
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && changed=$(git diff --name-only --no-renames HEAD^1 HEAD); then
            printf '%s\n' "$changed"
            area() { printf '%s\n' "$changed" | grep -qE "$1" && echo true || echo false; }
          else
            area() { echo true; }
          fi
          build='^(crates/|Cargo\.(toml|lock)$|\.cargo/|rust-toolchain\.toml$|\.github/workflows/ci\.yml$)'
          {
            echo "rust=$(area "$build|^(docs/reference|docs/openapi|test_corpora|examples|reference/vectors)/|^scripts/check-test-reachability\.sh$|^\.config/nextest\.toml$")"
            echo "conformance=$(area "$build|^(conformance|reference|test_corpora)/")"
            echo "clients=$(area "$build|^(clients|test_corpora|examples|docs/openapi|docs/reference)/|^scripts/(check-clients\.sh|version\.py)$")"
          } | tee -a "$GITHUB_OUTPUT"

  # The workspace's tests are built once here, instrumented for coverage, and `rust-tests` runs them
  # in three shards. `show-env` instruments only the workspace's crates, so the cached dependencies
  # still serve. The archive holds every test binary and the binaries they spawn, at the paths the
  # build gave them under `target/`.
  #
  # nextest does not run doc-tests, so `--doc` does. The reachability check asks the compiled
  # harnesses what they would run, so it shares this build rather than compiling the workspace
  # again. Both run after the archive is made, and `archived` lets the shards run where either
  # of them fails.
  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: rust (build)
    runs-on: ubuntu-24.04
    outputs:
      archived: ${{ steps.archive.outputs.archived }}
    env:
      # Debug info is most of what the test binaries occupy on disk. Without it a backtrace names a
      # function but not a line.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
      # A rolling channel, as rust-toolchain.toml names it. The `.stderr` fixtures under
      # crates/mosaica-types/tests/ui are compiler output, so a new rustc can turn the tests red on
      # wording alone.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - name: test binaries, instrumented for coverage
        id: archive
        run: |
          source <(cargo llvm-cov show-env --sh)
          cargo llvm-cov clean --workspace
          cargo nextest archive --workspace --archive-file "$RUNNER_TEMP/rust-tests.tar.zst"
          echo archived=true >> "$GITHUB_OUTPUT"
      # The archive is already compressed.
      - uses: actions/upload-artifact@v7
        with:
          name: rust-tests
          path: ${{ runner.temp }}/rust-tests.tar.zst
          compression-level: 0
          retention-days: 1
      - name: doc-tests and test reachability
        if: ${{ !cancelled() && steps.archive.outputs.archived == 'true' }}
        run: |
          source <(cargo llvm-cov show-env --sh)
          status=0
          cargo test --workspace --doc --no-fail-fast || status=1
          bash scripts/check-test-reachability.sh --quick || status=1
          exit $status

  # Each shard runs a third of the tests with `--profile ci` (.config/nextest.toml), which runs the
  # slow tier too and does not stop at the first failure. `slice:` deals the tests round-robin in
  # one sequence across every binary, where `count:` deals each binary's tests separately and so
  # puts the first test of every small binary in shard 1. The archive is unpacked at the workspace
  # root, so the binaries sit where the build put them and the paths compiled into the tests resolve.
  rust-tests:
    needs: rust
    if: ${{ !cancelled() && needs.rust.outputs.archived == 'true' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: rust (tests ${{ matrix.shard }}/3)
    steps:
      - uses: actions/checkout@v7
      # llvm-profdata merges this shard's profiles. trybuild compiles the cases under
      # crates/mosaica-types/tests/ui with this toolchain.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest
      # A test process that runs past ten minutes is taken to be hung: the watchdog writes every
      # thread's stack once per such process, attaching with gdb as root because Ubuntu's
      # `ptrace_scope` of 1 refuses a non-root attach to a process that is not a child. gdb stops
      # the process for the few seconds of the dump and detaches, and the `ci` profile ends the test
      # at fifteen minutes. gdb installs in the background, since the first dump is ten minutes
      # away, and a failed install fails no step. The runner ends the watchdog with the job.
      - name: watchdog for hung tests
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/hang/stacks"
          nohup bash -c '
            sudo apt-get update -q && sudo apt-get install -yq gdb
            while sleep 60; do
              ps -eo pid=,etimes= | while read -r pid age; do
                exe=$(readlink "/proc/$pid/exe") || continue
                case "$exe" in "$GITHUB_WORKSPACE"/target/*/deps/*) ;; *) continue ;; esac
                out="$RUNNER_TEMP/hang/stacks/$pid.txt"
                [ "$age" -gt 600 ] && [ ! -e "$out" ] || continue
                { tr "\0" " " < "/proc/$pid/cmdline"; echo; date -u
                  timeout 120 sudo gdb -iex "set debuginfod enabled off" -p "$pid" -batch -ex "thread apply all bt"; } > "$out" 2>&1
              done
            done' > "$RUNNER_TEMP/hang/watchdog.log" 2>&1 &
      - uses: actions/download-artifact@v8
        with:
          name: rust-tests
          path: ${{ runner.temp }}
      # Each test process writes its own profile, named by its process id. The step's limit sits
      # under the job's so that a hang fails the step and the diagnostics below are still uploaded.
      # `build_equals_ingest` appends each phase it reaches to the trace directory.
      - name: tests, shard ${{ matrix.shard }} of 3
        timeout-minutes: 45
        env:
          LLVM_PROFILE_FILE: ${{ github.workspace }}/target/mosaica-%p-%m.profraw
          MOSAICA_TEST_TRACE_DIR: ${{ runner.temp }}/hang/trace
        run: |
          cargo nextest run --profile ci --partition slice:${{ matrix.shard }}/3 \
            --archive-file "$RUNNER_TEMP/rust-tests.tar.zst" --extract-to . --extract-overwrite --workspace-remap .
      - name: this shard's coverage, as one profile
        if: ${{ !cancelled() }}
        run: |
          profdata="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin/llvm-profdata"
          find target -maxdepth 1 -name '*.profraw' > "$RUNNER_TEMP/profraw-list"
          "$profdata" merge -sparse -f "$RUNNER_TEMP/profraw-list" -o "$RUNNER_TEMP/rust-${{ matrix.shard }}.profdata"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: rust-profile-${{ matrix.shard }}
          path: ${{ runner.temp }}/rust-${{ matrix.shard }}.profdata
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: ${{ failure() || cancelled() }}
        with:
          name: hang-diagnostics-${{ matrix.shard }}
          path: ${{ runner.temp }}/hang
          if-no-files-found: ignore

  # The shards' profiles merged into the profile `cargo llvm-cov report` reads, and reported over
  # the archived binaries, whether or not the tests passed. Paths are made relative to the
  # repository root, as Codacy matches them.
  rust-coverage:
    needs: [rust, rust-tests]
    if: ${{ !cancelled() && needs.rust.outputs.archived == 'true' }}
    name: rust (coverage)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov
      - uses: actions/download-artifact@v8
        with:
          name: rust-tests
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v8
        with:
          pattern: rust-profile-*
          path: ${{ runner.temp }}/profiles
          merge-multiple: true
      - name: coverage report
        run: |
          tar --zstd -xf "$RUNNER_TEMP/rust-tests.tar.zst"
          profdata="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin/llvm-profdata"
          "$profdata" merge -sparse "$RUNNER_TEMP"/profiles/*.profdata -o target/mosaica.profdata
          source <(cargo llvm-cov show-env --sh)
          cargo llvm-cov report --lcov --output-path rust.lcov
          sed -i "s|^SF:$PWD/|SF:|" rust.lcov
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-rust
          path: rust.lcov

  # A check build, which shares nothing with the instrumented test build, so it runs beside it.
  clippy:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets -- -D warnings

  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The grep-based half of the architecture: forbidden dependency edges, the
      # no-tokio-in-engine-or-store rule, I4's cross-space conversions, and I10's EntityId in the
      # wire payload. Necessary and nowhere near sufficient — it runs here because locally it runs
      # from an opt-in pre-commit hook that is skipped in any worktree without a track marker,
      # which is not a gate.
      - run: bash scripts/check-layers.sh
      # The licences, banned crates, sources and advisories of the Rust dependency graph, against
      # deny.toml. Advisories read the RustSec database, which changes without a change here, so a
      # new advisory can turn this red on a commit that touched nothing.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  docs:
    uses: ./.github/workflows/docs.yml

  # The suite in each mode on its own runner: `one` builds every corpus as one shard, `many` over
  # several and leaves out the tests that set their own shard sizes (conformance/README.md).
  conformance:
    needs: changes
    if: needs.changes.outputs.conformance == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        mode: [one, many]
    name: conformance (${{ matrix.mode }})
    steps:
      - uses: actions/checkout@v7
      # A walk that fails while its server still runs prints every thread's stack with gdb, which
      # the runner image lacks; without it the report gives each thread's state and wait channel.
      # It installs in the background while the binary builds, and a failed install fails no step.
      - name: gdb, for the stacks of a server a failed walk leaves running
        run: nohup bash -c 'sudo apt-get update -q && sudo apt-get install -yq gdb' > "$RUNNER_TEMP/gdb.log" 2>&1 &
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The suite spawns the release `mosaica` binary and speaks the real API. Its own step keeps a
      # compile failure legible as one rather than as a suite error.
      - run: cargo build --release -p mosaica
      # The dependencies are read from `reference/pyproject.toml`, so the list has one copy. The
      # package is not installed: both suites reach `oracle` through the `sys.path` insert their
      # conftests make, as they do locally.
      - name: install the oracle's dependencies
        run: |
          python3 -m venv reference/.venv
          reference/.venv/bin/pip install --upgrade pip
          reference/.venv/bin/pip install $(reference/.venv/bin/python -c "
          import tomllib
          d = tomllib.load(open('reference/pyproject.toml', 'rb'))
          print(' '.join(d['project']['dependencies'] + d['project']['optional-dependencies']['dev']))
          ")
      - run: reference/.venv/bin/ruff check --config reference/pyproject.toml reference conformance
      # Fixtures are built once and cached in /tmp by a stamped recipe; on a fresh runner every one
      # of them is built from scratch, which is most of this job's wall-clock.
      - name: the conformance suite, ${{ matrix.mode }} shard mode
        env:
          MOSAICA_CONFORMANCE_SHARDS: ${{ matrix.mode }}
        run: reference/.venv/bin/pytest conformance/tests conformance/suite -v
      # The oracle's own tests, apart from those that build from the Phase 0 corpus: one file
      # ignored and three cases deselected by node id. Naming the exclusions rather than the
      # inclusions runs a new test file the day it lands, and a renamed case stops matching its
      # `--deselect` and fails on the missing corpus rather than passing unseen. Run from
      # `reference/`, where `testpaths` and the node ids are rooted: a `--deselect` given a
      # repo-relative path matches nothing and is not an error.
      - name: the oracle's own tests, minus what needs the Phase 0 corpus
        if: matrix.mode == 'one'
        working-directory: reference
        run: |
          .venv/bin/pytest -v tests \
            --ignore tests/test_differential.py \
            --deselect tests/test_identity.py::test_fixture_bundle_rows_are_stored_in_morton_then_mosaica_id_order \
            --deselect tests/test_identity.py::test_fixture_bundle_identity_column_agrees_with_the_key \
            --deselect tests/test_identity.py::test_fixture_bundle_sidecar_round_trips_through_the_locator

  clients:
    needs: changes
    if: needs.changes.outputs.clients == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Node >= 22.15, which both scripts below need: `check-clients.sh` refuses without npm on PATH,
      # the core tests compress with `node:zlib`'s zstd, and `clients/py/check.sh`'s wheel is built
      # by a hatchling hook that shells out to npm.
      - uses: actions/setup-node@v7
        with:
          node-version: "22.15"
          cache: npm
          cache-dependency-path: clients/ts/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # `clients/py/check.sh` installs `mosaica-native`, whose build hook compiles the release
      # `mosaica` binary and the `_mosaica` extension module.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # `check-clients.sh` requires an installed tree rather than installing one itself, so that a
      # developer's stale `node_modules` fails loudly instead of being silently repaired.
      - run: npm --prefix clients/ts ci
      # The components' browser suite (`npm run test:browser`) drives headless Chromium through
      # Playwright; `check-clients.sh` runs it and refuses where the browser is not installed.
      - name: Playwright's Chromium
        working-directory: clients/ts
        run: npx playwright install --with-deps chromium
      - run: bash scripts/check-clients.sh
      # Also runs the wheel's build hook for real, the only thing between `pip install
      # mosaica[widget]` and a widget with no JavaScript in it.
      - run: bash clients/py/check.sh
        env:
          PYTEST_ADDOPTS: --cov=mosaica --cov-report=xml:coverage.xml
      # The extension module's own tests, in the venv and on the build the step above made.
      - run: bash crates/mosaica-python/check.sh
      # coverage.py names files relative to the package; Codacy matches them from the repository root.
      - name: coverage report
        if: ${{ !cancelled() }}
        run: sed -i 's|filename="|filename="clients/py/mosaica/|' clients/py/coverage.xml
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-python
          path: clients/py/coverage.xml

  # Both jobs' coverage in one upload, whether or not their tests passed, and only where both ran:
  # an upload of one would read to Codacy as the other's files losing their coverage. The token is
  # empty on a fork's pull request, which skips the upload.
  coverage:
    needs: [rust-coverage, clients]
    if: ${{ !cancelled() && needs.rust-coverage.result != 'skipped' && needs.clients.result != 'skipped' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true
      - id: codacy
        env:
          TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: echo "token=${TOKEN:+yes}" >> "$GITHUB_OUTPUT"
      # A refused or failed upload is reported on the step and does not fail the gate.
      - uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        if: ${{ steps.codacy.outputs.token == 'yes' }}
        continue-on-error: true
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: rust.lcov,coverage.xml

  # The one check for branch protection to require: it fails where any job above failed or was
  # cancelled, and passes where each passed or was skipped.
  required:
    needs: [changes, rust, rust-tests, rust-coverage, clippy, checks, docs, conformance, clients]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
