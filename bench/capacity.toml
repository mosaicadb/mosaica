# Profiles for scripts/bench_capacity.py: many concurrent users, as memory shrinks below the bundle.
#
# A profile names the corpora to build and serve and the axes of its matrix; every key in
# [defaults] can be overridden in a profile. A corpus is a bench_ab.py profile at a number of
# items: `scatter` labels each item with one of 1,024 terms by hash, so a grant of `grant_width`
# terms sees about grant_width/1024 of the items, scattered across the map.
#
# Bundle bytes are about 62 an item for `scatter` (62.5 MB at 1M), so the ratio of bundle to cap
# for a profile can be read off before it runs.

[defaults]
binary = "target/release/mosaica"
bench = "target/release/mosaica-bench"
# Corpora are built under this cap; it bounds the build, not the cells.
build_cap = "unbounded"
seed = 0
# Seconds of each window: `cold` straight after the boot and an eviction of the bundle from the
# page cache, then `warm`.
cold_s = 10
warm_s = 20
boot_timeout_s = 900
hang_timeout_ms = 30000
# CPUs for the server and the generator, as taskset lists; empty shares them all.
server_cpus = "1-3"
generator_cpus = "0"
generator_threads = 1
# Terms in each user's grant, and the number of grants arm B shares among all its users.
grant_width = 64
shared_grants = 4
policies = ["default", "tuned"]
arms = ["A", "B"]
think_ms = [0, 1000]

# Request kinds and their weights. `pan` moves each user's close-up a step from where it last
# looked; `filtered` is the same with a category filter; `overview` draws the whole map; then a
# cell-count aggregate and a page of items.
[defaults.mix]
pan = 55
filtered = 15
overview = 10
aggregate = 10
items = 10

# The `tuned` policy: each cache's bytes as a fraction of the cap. A third of the cap goes to the
# caches; the rest is left to the page cache, the heap and the request buffers.
[defaults.tuned]
row_projection_cache_bytes = 0.12
fragment_cache_bytes = 0.06
masked_count_cache_bytes = 0.03
filter_cache_bytes = 0.06
region_cache_bytes = 0.03
occupancy_cache_bytes = 0.01

# Extra [serve] keys for every cell.
[defaults.serve]

# A few minutes: proves the tooling end to end on any box.
[profile.smoke]
corpora = [{ profile = "scatter", items = 1_000_000 }]
caps = ["256M", "unbounded"]
users = [10, 100]
think_ms = [0]
cold_s = 5
warm_s = 10

# A 4-core, 16 GiB box with ~30 GB of disk. Bundles of about 0.6 GB and 6 GB; caps from 512 MiB
# to unbounded take the ratio of bundle to memory from under 0.1 to about 12.
[profile.small]
corpora = [
  { profile = "scatter", items = 10_000_000 },
  { profile = "scatter", items = 100_000_000 },
]
caps = ["512M", "1G", "2G", "4G", "8G", "unbounded"]
users = [10, 100, 1000]
think_ms = [0, 1000]

# A large box: run the generator on another machine, or give it more cores here, before believing
# the many-user cells. Bundles of about 6, 60 and 120 GB.
[profile.large]
corpora = [
  { profile = "scatter", items = 100_000_000 },
  { profile = "scatter", items = 1_000_000_000 },
  { profile = "scatter", items = 2_000_000_000 },
]
caps = ["4G", "16G", "32G", "64G", "128G", "unbounded"]
users = [100, 1000, 5000, 20000]
think_ms = [0, 2000]
server_cpus = ""
generator_cpus = ""
generator_threads = 8
cold_s = 30
warm_s = 60
