float:
  angular:
  - base_args: ['@metric']
    constructor: VexactExact
    disabled: false
    docker_tag: ann-benchmarks-vexact
    module: ann_benchmarks.algorithms.vexact
    name: vexact-exact
    run_groups:
      exact:
        args: [[{basis: pca}, {basis: dual}]]
  - base_args: ['@metric']
    constructor: VexactApprox
    disabled: false
    docker_tag: ann-benchmarks-vexact
    module: ann_benchmarks.algorithms.vexact
    name: vexact-approx
    run_groups:
      approx:
        args: [[{basis: pca}, {basis: dual}]]
        query_args: [[1, 2, 4, 8, 16, 32, 64, 128, 256, 512], [0, 0.01, 0.03]]
