float:
  angular:
  - base_args: ['@metric']
    constructor: VexactExact
    disabled: false
    docker_tag: ann-benchmarks-vexact
    module: ann_benchmarks.algorithms.vexact
    name: vexact-exact
    run_groups:
      exact:
        args: [{basis: dual}]
  - base_args: ['@metric']
    constructor: VexactApprox
    disabled: false
    docker_tag: ann-benchmarks-vexact
    module: ann_benchmarks.algorithms.vexact
    name: vexact-approx
    run_groups:
      approx:
        args: [{basis: dual}]
        query_args: [[3, 3.5, 4, 4.5, 5, 5.5, 6, 7]]
  # the legacy approximate arm (the spread order by nprobe), kept for comparison
  - base_args: ['@metric']
    constructor: VexactNprobe
    disabled: false
    docker_tag: ann-benchmarks-vexact
    module: ann_benchmarks.algorithms.vexact
    name: vexact-nprobe
    run_groups:
      nprobe:
        args: [{basis: dual}]
        query_args: [[1, 2, 4, 8, 16, 32, 64, 128, 256, 512]]
  # research/levels-clusters' candidates (REPORT_BUILD.md), in the legacy arm: A clusters by N, B two deterministic
  # levels, C both
  - base_args: ['@metric']
    constructor: VexactNprobe
    disabled: false
    docker_tag: ann-benchmarks-vexact
    module: ann_benchmarks.algorithms.vexact
    name: vexact-approx-lc
    run_groups:
      A:
        args: [{basis: dual, clusters: by-n}]
        query_args: [[1, 2, 4, 8, 16, 32, 64, 128, 256, 512]]
      B:
        args: [{basis: dual, dlv: "16.32"}]
        query_args: [[1, 2, 4, 8, 16, 32, 64, 128, 256, 512]]
      C:
        args: [{basis: dual, clusters: by-n, dlv: "16.32"}]
        query_args: [[1, 2, 4, 8, 16, 32, 64, 128, 256, 512]]
