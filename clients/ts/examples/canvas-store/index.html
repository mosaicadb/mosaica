<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mosaica — the store on a canvas</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; font: 14px system-ui, sans-serif; background: #111; color: #ddd; }
      body { display: grid; grid-template-rows: auto 1fr auto; }
      main { min-height: 0; }
      header, footer { display: flex; gap: 1.5rem; align-items: center; padding: 0.4rem 1rem; }
      h1 { margin: 0; font-size: inherit; }
      canvas { display: block; width: 100%; height: 100%; cursor: grab; }
      canvas:focus-visible { outline: 2px solid #9cf; outline-offset: -2px; }
      #status[data-state='refused'], #status[data-state='refused'] + #notice { color: #f66; }
      #status[data-state='stale'], #status[data-state='stale'] + #notice { color: #fc6; }
      button { font: inherit; }
    </style>
  </head>
  <body>
    <header>
      <h1>Mosaica store, no Mosaica rendering</h1>
      <label>signed in as <select id="principal"></select></label>
    </header>
    <main>
      <canvas id="map" tabindex="0" role="application" aria-label="Map of the items you may see: arrow keys pan, + and - zoom"></canvas>
    </main>
    <footer>
      <span id="status" data-state="idle">idle</span>
      <span id="notice" role="status"></span>
      <span>shown <b id="shown"></b></span>
      <span>matched <b id="matched"></b></span>
      <span>visible <b id="visible"></b></span>
      <span id="marks"></span>
      <button id="refresh" hidden>refresh</button>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
