name: Bug report
description: Report something in Mosaica that does not work.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include any error message or refusal in full.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The commands, code or requests that show the problem, starting from an empty directory if you can. A small schema and a few rows of data help most.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `mosaica --version`, and the client's version if you used one.
      placeholder: mosaica <version> (<commit>)
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: How you used Mosaica
      multiple: true
      options:
        - Python client
        - TypeScript client or components
        - Command line
        - HTTP API
        - Docker image
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Operating system and architecture, and the browser if the problem is in a web page.
      placeholder: Ubuntu 24.04 on x86_64, Firefox 140
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Server log
      description: The lines the server logged around the problem, if there are any.
      render: text
