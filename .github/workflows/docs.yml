# The documentation checks and the site's build, as `scripts/check-docs.sh` runs them. The gate
# (`ci.yml`) calls this on every pull request; `pages.yml` calls it with `pages` set, and the built
# site is uploaded for GitHub Pages to deploy.

name: docs

on:
  workflow_call:
    inputs:
      pages:
        description: Upload the built site as the GitHub Pages artifact.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/constraints.txt
      - run: pip install -r docs/requirements.txt -c docs/constraints.txt
      # The TypeScript and components reference is generated from clients/ts before the site's build.
      - uses: actions/setup-node@v7
        with:
          node-version: "22.15"
          cache: npm
          cache-dependency-path: clients/ts/package-lock.json
      - run: npm --prefix clients/ts ci
      - run: bash scripts/check-docs.sh site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: ${{ inputs.pages }}
        with:
          path: site
