# CZ CELLxGENE Census 2025-11-08: every human and mouse cell, laid out by UMAP over its scVI
# embedding.
#
# `prepare.py` writes a copy of this file beside the data, with `# <vocabularies>` replaced by the
# value sets it minted. `[sources]` paths are relative to the declaring file, so the copy is what
# `mosaica build` reads.

[sources]
cells           = "cells.parquet"
points_human    = "points-human.parquet"
points_mouse    = "points-mouse.parquet"
cell_types      = "members-cell-ontology.parquet"
cell_type_names = "artifacts-cell-ontology.parquet"
cell_type       = "vocab-cell-type.parquet"
tissue          = "vocab-tissue.parquet"
tissue_general  = "vocab-tissue-general.parquet"
disease         = "vocab-disease.parquet"
assay           = "vocab-assay.parquet"
sex             = "vocab-sex.parquet"
development     = "vocab-development-stage.parquet"
ethnicity       = "vocab-self-reported-ethnicity.parquet"
suspension      = "vocab-suspension-type.parquet"
organism        = "vocab-organism.parquet"
collection      = "vocab-collection.parquet"
dataset         = "vocab-dataset.parquet"

# Every attribute is read from `cells.parquet`, which holds both species. Each view's points file
# holds only its own species' cells, so a human cell has no position on the mouse map.
[defaults]
source          = "cells"
allocation_view = "human"

# A cell from a restricted collection carries that collection's term in `access`, spelled
# `collection:<collection id>`; every other cell has no label and takes the default.
[[view]]
name             = "human"
title            = "Human cells"
projection       = "none"
extent           = "auto"
source           = "points_human"
visibility       = "public"
point_visibility = { field = "access", default = "public" }

[[view]]
name             = "mouse"
title            = "Mouse cells"
projection       = "none"
extent           = "auto"
source           = "points_mouse"
visibility       = "public"
point_visibility = { field = "access", default = "public" }

# All vocabularies are closed, minted from the staged cell tables, and `derived`: a viewer is
# served a value only where they can see one of its cells, so a disease or a collection that only
# restricted collections carry reaches only those who hold one of them.
# <vocabularies>

# The row number `prepare.py` gives each cell: the Census `soma_joinid` for a human cell, and the
# human cell count plus the `soma_joinid` for a mouse cell.
[[attribute]]
name   = "id"
type   = "u64"
unique = true
field  = "entity_id"

# The Census's own row id within the species, to find the cell in the Census.
[[attribute]]
name  = "soma_joinid"
title = "Census soma_joinid"
type  = "u64"

[[attribute]]
name       = "cell_type"
title      = "Cell type"
type       = "category"
vocabulary = "cell_type"
render     = true
index      = true

[[attribute]]
name       = "tissue"
title      = "Tissue"
type       = "category"
vocabulary = "tissue"
render     = true
index      = true

[[attribute]]
name       = "tissue_general"
title      = "Tissue (general)"
type       = "category"
vocabulary = "tissue_general"
render     = true
index      = true

[[attribute]]
name       = "disease"
title      = "Disease"
type       = "category"
vocabulary = "disease"
render     = true
index      = true

[[attribute]]
name       = "assay"
title      = "Assay"
type       = "category"
vocabulary = "assay"
render     = true
index      = true

[[attribute]]
name       = "sex"
title      = "Sex"
type       = "category"
vocabulary = "sex"
render     = true
index      = true

[[attribute]]
name       = "development_stage"
title      = "Development stage"
type       = "category"
vocabulary = "development_stage"
render     = true
index      = true

[[attribute]]
name       = "self_reported_ethnicity"
title      = "Self-reported ethnicity"
type       = "category"
vocabulary = "self_reported_ethnicity"
render     = true
index      = true

[[attribute]]
name       = "suspension_type"
title      = "Suspension type"
type       = "category"
vocabulary = "suspension_type"
render     = true
index      = true

[[attribute]]
name       = "organism"
title      = "Organism"
type       = "category"
vocabulary = "organism"
index      = true

[[attribute]]
name       = "collection"
title      = "Collection"
type       = "category"
vocabulary = "collection"
render     = true
index      = true

[[attribute]]
name       = "dataset"
title      = "Dataset"
type       = "category"
vocabulary = "dataset"
index      = true

# Unique cells only: false on a cell that also appears in another dataset.
[[attribute]]
name   = "is_primary_data"
title  = "Primary data"
type   = "bool"
render = true
index  = true

[[attribute]]
name  = "dataset_id"
title = "Dataset id"
type  = "keyword"
index = true

[[attribute]]
name  = "donor_id"
title = "Donor id"
type  = "keyword"
index = true

[[attribute]]
name   = "n_genes"
title  = "Genes detected"
type   = "u32"
field  = "nnz"
render = true
index  = true

[[attribute]]
name  = "raw_sum"
title = "Total counts"
type  = "f32"
index = true

# The Cell Ontology in four tiers, by the rule in `ontology.py`: a broad class, a lineage, the cell
# type's parent and the cell type. A member row is one cell with its four keys. A key is its tier
# and a cell type label, `t2:T cell`, because a short chain repeats a label at several tiers; the
# artifacts file names each artifact by the label alone. A tier artifact is served only to a
# viewer who can see one of its cells.
[[layer]]
name                      = "cell-ontology"
title                     = "Cell Ontology"
views                     = ["human", "mouse"]
source                    = "cell_type_names"
membership                = "enumerated"
value_set                 = "open"
hierarchy                 = { kind = "tiered", prune_children = true }
visibility                = "public"
artifact_visibility       = { default = "inherited" }
require_member_visibility = { count = 1 }

[[layer.levels]]
level = 0
title = "Class"
zoom  = [0, 3]

[[layer.levels]]
level = 1
title = "Lineage"
zoom  = [3, 6]

[[layer.levels]]
level = 2
title = "Parent type"
zoom  = [6, 9]

[[layer.levels]]
level = 3
title = "Cell type"
zoom  = [9, 16]

[layer.content]
computed = ["centroid", "box"]

  [[layer.content.supplied]]
  name                      = "name"
  type                      = "text"
  require_member_visibility = "inherited"

[layer.members]
source = "cell_types"
fields = { id = "entity" }
